services:
  - type: web
    name: paper-finder-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    branch: main
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        value: sqlite:///./data/paperfinder.db
      - key: CORS_ORIGINS
        value: '["https://your-frontend-domain.onrender.com"]'
      # Secrets - set these in Render dashboard
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: IEEE_API_KEY
        sync: false
      - key: SEMANTIC_SCHOLAR_API_KEY
        sync: false
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
